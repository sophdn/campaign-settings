# Local dev Postgres. Pinned by digest (vet+pin discipline — official postgres
# 17.5-alpine). Port 5433 on the host to avoid clashing with a system Postgres.
services:
  postgres:
    image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
    environment:
      POSTGRES_USER: campaign
      POSTGRES_PASSWORD: campaign
      POSTGRES_DB: campaign_dev
    ports:
      - '5433:5432'
    volumes:
      - campaign-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U campaign -d campaign_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campaign-pgdata:
